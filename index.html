<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lallou - Informations légales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .links {
            display: grid;
            gap: 20px;
        }
        
        .link-card {
            display: block;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .link-card h2 {
            color: #667eea;
            font-size: 1.4em;
            margin-bottom: 8px;
        }
        
        .link-card p {
            color: #666;
            font-size: 0.95em;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 0.9em;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👶 Lallou</h1>
            <p class="subtitle">Informations légales</p>
        </header>
        
        <div class="content">
            <div class="links">
                <a href="privacy-policy.html" class="link-card">
                    <h2>🔒 Politique de confidentialité</h2>
                    <p>Comment nous protégeons vos données personnelles</p>
                </a>
                
                <a href="terms-of-service.html" class="link-card">
                    <h2>📜 Conditions d'utilisation</h2>
                    <p>Règles d'utilisation de l'application</p>
                </a>
                
                <a href="support.html" class="link-card">
                    <h2>💬 Support</h2>
                    <p>Besoin d'aide ? Contactez-nous</p>
                </a>
            </div>
        </div>
        
        <footer>
            <p>Lallou © 2026 - Tous droits réservés</p>
            <p>Version 1.0</p>
        </footer>
    </div>
</body>
</html>
